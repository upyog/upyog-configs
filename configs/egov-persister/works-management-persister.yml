    - version: 1.0
      description: Action Plan - status only (verify / approve / return / reject / withdraw)
      fromTopic: update-wms-action-plan-workflow
      isTransaction: true
      queryMaps:
        - query: INSERT INTO eg_wms_action_plan_audit SELECT * FROM eg_wms_action_plan WHERE id = ?;
          basePath: ActionPlan
          jsonMaps:
            - jsonPath: $.ActionPlan.id

        - query: INSERT INTO eg_wms_action_plan_audit SELECT * FROM eg_wms_action_plan WHERE tenantid = ? AND actionplannumber = ? AND id <> ? AND islatestversion = true AND ? = 'APPROVED';
          basePath: ActionPlan
          jsonMaps:
            - jsonPath: $.ActionPlan.tenantId
            - jsonPath: $.ActionPlan.actionPlanNumber
            - jsonPath: $.ActionPlan.id
            - jsonPath: $.ActionPlan.status

        - query: UPDATE eg_wms_action_plan SET islatestversion = false, status = 'SUPERSEDED', lastmodifiedby = ?, lastmodifiedtime = ? WHERE tenantid = ? AND actionplannumber = ? AND id <> ? AND islatestversion = true AND ? = 'APPROVED';
          basePath: ActionPlan
          jsonMaps:
            - jsonPath: $.ActionPlan.auditDetails.lastModifiedBy
            - jsonPath: $.ActionPlan.auditDetails.lastModifiedTime
            - jsonPath: $.ActionPlan.tenantId
            - jsonPath: $.ActionPlan.actionPlanNumber
            - jsonPath: $.ActionPlan.id
            - jsonPath: $.ActionPlan.status

        - query: UPDATE eg_wms_action_plan SET actionplannumber = ?, islatestversion = ?, status = ?, submitteddate = ?, approveddate = ?, approvedby = ?, lastmodifiedby = ?, lastmodifiedtime = ? WHERE id = ?;
          basePath: ActionPlan
          jsonMaps:
            - jsonPath: $.ActionPlan.actionPlanNumber
            - jsonPath: $.ActionPlan.isLatestVersion
            - jsonPath: $.ActionPlan.status
            - jsonPath: $.ActionPlan.submittedDate
            - jsonPath: $.ActionPlan.approvedDate
            - jsonPath: $.ActionPlan.approvedBy
            - jsonPath: $.ActionPlan.auditDetails.lastModifiedBy
            - jsonPath: $.ActionPlan.auditDetails.lastModifiedTime
            - jsonPath: $.ActionPlan.id

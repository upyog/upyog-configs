            - jsonPath: $.refund.auditDetails.lastModifiedBy
            - jsonPath: $.refund.auditDetails.lastModifiedTime
            - jsonPath: $.refund.fileStoreId

    - version: 1.0
      description: Update refund
      fromTopic: update-refund
      isTransaction: true

      queryMaps:
        - query: UPDATE public.eg_rs_refund SET refund_no = ?,tenant_id = ?,module_name = ?,business_service = ?,consumer_code = ?,payment_id = ?,applicant_name = ?,mobile_number = ?,refund_category = ?,refund_reason = ?,payment_mode_original = ?,amount_paid = ?,refund_amount = ?,refund_mode = ?,status = ?,sanction_ref = ?,finance_approval_date = ?,gateway_refund_id = ?,beneficiary_details = ?::jsonb,additional_details = ?::jsonb,last_modified_by = ?,last_modified_time = ?,file_store_id = ? WHERE id = ?::uuid;
          basePath: refund
          jsonMaps:
            - jsonPath: $.refund.refundNo
            - jsonPath: $.refund.tenantId
            - jsonPath: $.refund.moduleName
            - jsonPath: $.refund.businessService
            - jsonPath: $.refund.consumerCode

serviceMaps:
  serviceName: refund-services

  mappings:
    - version: 1.0
      description: Create refund
      fromTopic: save-refund
      isTransaction: true

      queryMaps:
        - query: INSERT INTO public.eg_rs_refund (id,refund_no,tenant_id,module_name,business_service,consumer_code,payment_id,applicant_name,mobile_number,refund_category,refund_reason,payment_mode_original,amount_paid,refund_amount,refund_mode,status,sanction_ref,finance_approval_date,gateway_refund_id,beneficiary_details,additional_details,created_by,created_time,last_modified_by,last_modified_time,file_store_id) VALUES (?::uuid, ?, ?, ?, ?, ?, ?,?, ?, ?, ?, ?, ?, ?,?, ?, ?, ?, ?, ?::jsonb,?::jsonb, ?, ?, ?, ?, ?);
          basePath: refund
          jsonMaps:
            - jsonPath: $.refund.id
            - jsonPath: $.refund.refundNo
            - jsonPath: $.refund.tenantId
            - jsonPath: $.refund.moduleName
            - jsonPath: $.refund.businessService
            - jsonPath: $.refund.consumerCode

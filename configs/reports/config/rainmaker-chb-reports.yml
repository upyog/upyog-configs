  - reportName: PaymentRefundReport
    decryptionPathId: TradeLicenseDailyCollectionReport
    summary: Payment Refund Report
    version: 1.0.0
    moduleName: rainmaker-CHB
    sourceColumns:
      - name: transactionnumber
        label: rainmaker.CHB.transactionnumber
        type: string
        source: PG
        total: false
      - name: tenantid
        label: rainmaker.CHB.tenant
        type: string
        source: PG
        total: false
      - name: totalamountpaid
        label: rainmaker.CHB.amount
        type: string
        source: PG
        total: true
      - name: paymentmode
        label: rainmaker.CHB.paymentmode
        type: string
        source: PG
        total: false
      - name: instrumentstatus
        label: rainmaker.CHB.instrumentstatus
        type: string
        source: PG
        total: false
      - name: paidby
        label: rainmaker.CHB.paidby
        type: string
        source: PG
        total: false
      - name: mobilenumber
        label: rainmaker.CHB.mobile
        type: string
        source: PG
        total: false
      - name: createdtime
        label: rainmaker.CHB.createdtime
        type: string
        source: PG
        showColumn: false
    searchParams:
      - name: transactionnumber
        label: rainmaker.CHB.transactionnumber
        type: string
        source: PG
        isMandatory: false
        searchClause: AND p.transactionnumber = $transactionnumber
      - name: fromDate
        label: rainmaker.CHB.fromDate
        type: epoch
        source: PG
        isMandatory: true
        searchClause: AND p.createdtime >= $fromDate
      - name: toDate
        label: rainmaker.CHB.toDate
        type: epoch
        source: PG
        isMandatory: true
        searchClause: AND p.createdtime <= $toDate
    query: >
      select 
        p.transactionnumber,
        p.tenantid,
        p.totalamountpaid,
        p.paymentmode,
        p.instrumentstatus,
        p.paidby,
        p.mobilenumber,
        p.createdtime
      FROM egcl_payment p
      WHERE p.instrumentstatus = 'REFUNDED'
      AND 1=1
        source: CHB
        total: false  
      - name: community_hall_code
        label: rainmaker.CHB.community_hall_code
        type: string
        source: CHB
        total: false
        isLocalisationRequired: true
      - name: booking_no
        label: rainmaker.CHB.booking_no
        type: string
        source: CHB
        total: false
      - name: amountpaid
        label: rainmaker.CHB.amountpaid
        type: string
        source: CHB
        total: true
      - name: booking_date
        label: rainmaker.CHB.booking_date
        type: string
        source: CHB
        total: false
      - name: status
        label: rainmaker.CHB.status
        type: string
        source: CHB
        total: false  
      - name: createdtime
        label: rainmaker.CHB.createdtime
        type: string
        source: CHB
        showColumn: false
    searchParams:
      - name: booking_no
        label: rainmaker.CHB.booking_no
        type: string
        source: CHB
        isMandatory: false
        searchClause: AND b.booking_no = $booking_no
      - name: fromDate
        label: rainmaker.CHB.fromDate
        type: epoch
        source: CHB
        isMandatory: true
        searchClause: AND b.createdtime >= $fromDate
      - name: toDate
        label: rainmaker.CHB.toDate
        type: epoch
        source: CHB
        isMandatory: true
        searchClause: AND b.createdtime <= $toDate
    query: >
      select a.applicant_name as name,
      a.applicant_mobile_no as mobileNumber,
      b.venue_code as community_hall_code,
      b.createdtime as createdtime,
      b.booking_no as booking_no,
      p.amountpaid as amountpaid,
      h.booking_date as booking_date,
      h.status as status
      from eg_chb_applicant_detail a, eg_chb_booking_detail b, egcl_paymentdetail p, eg_chb_slot_detail h
      where a.booking_id=b.booking_id and b.receipt_no=p.receiptnumber and b.booking_id=h.booking_id and h.status='REFUNDAPPROVED'
      and 1=1
  - reportName: PaymentRefundReport
    decryptionPathId: TradeLicenseDailyCollectionReport
    summary: Payment Refund Report
    version: 1.0.0
    moduleName: rainmaker-CHB
    sourceColumns:
    - name: consumer_code
      label: rainmaker.CHB.consumerCode
      type: string
      source: CHB
      total: false
    - name: refund_no
      label: rainmaker.CHB.refundNo
      type: string
      source: CHB
      total: false
    - name: tenant_id
      label: rainmaker.CHB.tenant
      type: string
      source: CHB
      total: false
    - name: applicant_name
      label: rainmaker.CHB.applicantName
      type: string
      source: CHB
      total: false
    - name: refund_amount
      label: rainmaker.CHB.refundAmount
      type: string
      source: CHB
      total: true
    - name: refund_mode
      label: rainmaker.CHB.refundMode
      type: string
      source: CHB
      total: false
    - name: status
      label: rainmaker.CHB.refundStatus
      type: string
      source: CHB
      total: false
    - name: refund_created_date
      label: rainmaker.CHB.refundCreatedDate
      type: string
      source: CHB
      total: false
    searchParams:
    - name: refund_no
      label: rainmaker.CHB.refundNo
      type: string
      source: CHB
      isMandatory: false
      searchClause: AND r.refund_no = $refund_no
    - name: consumer_code
      label: rainmaker.CHB.consumerCode
      type: string
      source: CHB
      isMandatory: false
      searchClause: AND r.consumer_code = $consumer_code
    - name: refund_mode
      label: rainmaker.CHB.refundMode
      type: singlevaluelist
      pattern: http://egov-mdms-service:8080/egov-mdms-service/v1/_get?tenantId=pg&moduleName=common-masters&masterName=RefundMode|$.MdmsRes['common-masters'].RefundMode[*].code|$.MdmsRes['common-masters'].RefundMode[*].name
      source: CHB
      isMandatory: false
      searchClause: AND r.refund_mode = $refund_mode
    - name: fromDate
      label: rainmaker.CHB.fromDate
      type: epoch
      source: CHB
      isMandatory: true
      searchClause: AND r.created_time >= $fromDate
    - name: toDate
      label: rainmaker.CHB.toDate
      type: epoch
      source: CHB
      isMandatory: true
      searchClause: AND r.created_time <= $toDate
    query: |
          SELECT
            r.consumer_code,
            r.refund_no,
            r.tenant_id,
            r.applicant_name,
            r.refund_amount,
            r.refund_mode,
            r.status,
            TO_CHAR(
              TO_TIMESTAMP(r.created_time / 1000.0)
              AT TIME ZONE 'Asia/Kolkata',
              'DD-MM-YYYY HH24:MI:SS'
            ) AS refund_created_date
          FROM eg_rs_refund r
          WHERE r.business_service = 'CHB.REFUND'
          AND r.module_name = 'CHB'
          AND 1=1
    orderby: ORDER BY r.created_time DESC

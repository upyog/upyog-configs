SearchDefinitions:
  moduleName: chb-services
  summary: Chb Services Inbox API
  version: 1.0.0
  definitions:
    - name: inboxchbsearch
      query:
        baseQuery: Select row_to_json(result) from
          (
            select DISTINCT chb.booking_no,
          chb.booking_status, chb.createdtime from eg_chb_booking_detail as chb
          $where order by chb.createdtime asc $pagination 
          ) result
        groupBy:
        orderBy:
      searchParams:
        condition: AND
        params:
          - name: chb.tenant_id
            isMandatory: true
            jsonPath: $.searchCriteria.tenantId
          - name: chb.booking_no
            isMandatory: false
            jsonPath: $.searchCriteria.bookingNo
        pagination:
          noOfRecords: $.searchCriteria.noOfRecords
          offset: $.searchCriteria.offset

      output:
        jsonFormat: {"ResponseInfo": {},"hallsBookingApplication": []}
        outJsonPath: $.hallsBookingApplication
        responseInfoPath: $.ResponseInfo
    - name: inboxchbsearchdesc
      query:
        baseQuery: Select row_to_json(result) from
         ( select DISTINCT chb.booking_no,
          chb.booking_status, chb.createdtime from eg_chb_booking_detail as chb
          $where order by chb.createdtime desc $pagination 
          ) result
        groupBy:
        orderBy:
      searchParams:
        condition: AND
        params:
          - name: chb.tenant_id
            isMandatory: true
            jsonPath: $.searchCriteria.tenantId
          - name: chb.booking_no
            isMandatory: false
            jsonPath: $.searchCriteria.bookingNo
        pagination:
          noOfRecords: $.searchCriteria.noOfRecords
          offset: $.searchCriteria.offset

      output:
        jsonFormat: {"ResponseInfo": {},"hallsBookingApplication": []}
        outJsonPath: $.hallsBookingApplication
        responseInfoPath: $.ResponseInfo
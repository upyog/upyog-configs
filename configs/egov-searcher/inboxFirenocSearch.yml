SearchDefinitions:
 moduleName: firenoc-services
 summary: Fire-Noc Services Inbox API
 version: 1.0.0
 definitions:
 - name: inboxfirenocsearch
   query:
    baseQuery: Select row_to_json(result) from
          (
          select DISTINCT(firenoc.applicationnumber) as applicationnumber,firenoc.createdtime as createdtime from eg_fn_firenocdetail as firenoc
          INNER JOIN eg_fn_firenoc as fnoc ON fnoc.uuid = firenoc.firenocuuid
          INNER JOIN eg_wf_processinstance_v2 pi ON pi.businessid = firenoc.applicationnumber
          LEFT JOIN eg_wf_assignee_v2 assg ON pi.id = assg.processinstanceid
          $where
          AND pi.createdtime IN (select max(createdtime) from eg_wf_processinstance_v2 wf where wf.businessid = firenoc.applicationnumber GROUP BY wf.businessid)
          order by firenoc.createdtime asc $pagination
          ) result
    groupBy:
    orderBy:
   searchParams:
    condition: AND
    params:
    - name: fnoc.tenantid
      isMandatory: true
      jsonPath: $.searchCriteria.tenantId
    - name: assg.assignee
      isMandatory: false
      jsonPath: $.searchCriteria.assignee
    - name: pi.status
      isMandatory: false
      jsonPath: $.searchCriteria.status
    - name: firenoc.applicationnumber
      isMandatory: false
      jsonPath: $.searchCriteria.applicationNumber
    - name: pi.businessservice
      isMandatory: false
      jsonPath: $.searchCriteria.businessservice
    pagination:
      noOfRecords: $.searchCriteria.noOfRecords
      offset: $.searchCriteria.offset

   output:
    jsonFormat: {"ResponseInfo": {},"FireNOCs": []}
    outJsonPath: $.FireNOCs
    responseInfoPath: $.ResponseInfo

 - name: inboxfirenocsearchcount
   query:
    baseQuery: SELECT row_to_json(TotalCount) from (SELECT COUNT(result) from
          (
          select DISTINCT(firenoc.applicationnumber) as applicationnumber,firenoc.createdtime as createdtime from eg_fn_firenocdetail as firenoc
          INNER JOIN eg_fn_firenoc as fnoc ON fnoc.uuid = firenoc.firenocuuid
          INNER JOIN eg_wf_processinstance_v2 pi ON pi.businessid = firenoc.applicationnumber
          LEFT JOIN eg_wf_assignee_v2 assg ON pi.id = assg.processinstanceid
          $where
          AND pi.createdtime IN (select max(createdtime) from eg_wf_processinstance_v2 wf where wf.businessid = firenoc.applicationnumber GROUP BY wf.businessid)
          order by firenoc.createdtime asc $pagination
          ) result) TotalCount
    groupBy:
    orderBy:
   searchParams:
    condition: AND
    params:
    - name: fnoc.tenantid
      isMandatory: true
      jsonPath: $.searchCriteria.tenantId
    - name: assg.assignee
      isMandatory: false
      jsonPath: $.searchCriteria.assignee
    - name: pi.status
      isMandatory: false
      jsonPath: $.searchCriteria.status
    - name: firenoc.applicationnumber
      isMandatory: false
      jsonPath: $.searchCriteria.applicationNumber
    - name: pi.businessservice
      isMandatory: false
      jsonPath: $.searchCriteria.businessservice
    pagination:
      noOfRecords: $.searchCriteria.noOfRecords
      offset: $.searchCriteria.offset

   output:
    jsonFormat: {"ResponseInfo": {},"TotalCount": {}}
    outJsonPath: $.TotalCount
    responseInfoPath: $.ResponseInfo


SearchDefinitions:
  moduleName: garbage-service
  summary: Garbage Service Inbox API
  version: 1.0.0
  definitions:
    - name: inboxGCSearch
      query:
        baseQuery: Select row_to_json(result) from
          (
          select DISTINCT(urgc.application_no),pi.createdtime from 
          eg_grbg_application as urgc
          INNER JOIN eg_grbg_account as acc ON acc.garbage_id = urgc.garbage_id
          INNER JOIN eg_wf_processinstance_v2 pi ON pi.businessid = urgc.application_no
          LEFT JOIN eg_wf_assignee_v2 assg ON pi.id = assg.processinstanceid
          $where
          AND pi.createdtime IN (select max(createdtime) from eg_wf_processinstance_v2 wf where wf.businessid = urgc.application_no GROUP BY wf.businessid)
          order by pi.createdtime asc $pagination
          ) result
        groupBy:
        orderBy:
      searchParams:
        condition: AND
        params:
          - name: acc.tenant_id
            isMandatory: true
            jsonPath: $.searchCriteria.tenantId
          - name: urgc.application_no
            isMandatory: false
            jsonPath: $.searchCriteria.applicationNo
          - name: pi.status
            isMandatory: false
            jsonPath: $.searchCriteria.status
          - name: assg.assignee
            isMandatory: false
            jsonPath: $.searchCriteria.assignee
          - name: pi.businessservice
            isMandatory: false
            jsonPath: $.searchCriteria.businessservice
        pagination:
          noOfRecords: $.searchCriteria.noOfRecords
          offset: $.searchCriteria.offset

      output:
        jsonFormat: {"ResponseInfo": {},"garbageAccounts": []}
        outJsonPath: $.garbageAccounts
        responseInfoPath: $.ResponseInfo

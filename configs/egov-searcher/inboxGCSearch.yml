    - name: inboxGCSearchCount
      query:
        baseQuery: SELECT row_to_json(TotalCount) from (SELECT COUNT(result) from
          (
          select urgc.application_no, pi.createdtime from 
          eg_grbg_application urgc
          INNER JOIN eg_grbg_account as acc ON acc.garbage_id = urgc.garbage_id
